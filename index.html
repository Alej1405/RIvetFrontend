<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fuentes de marca (Typekit): Noto Sans, Mundial, Helvetica.
         preconnect adelanta el handshake a los hosts de Typekit. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/cjy3wka.css" />

    <!-- title, description, canonical, og:* y twitter:* los gestiona react-helmet-async
         por página (ver components/Seo.tsx). Aquí solo el default por si una ruta no lo fija. -->
    <title>RIVET Ecuador — Ingeniería Alimentaria</title>
    <meta name="author" content="Rivet Ecuador S.A.S." />
    <meta name="robots" content="index, follow" />
    <meta property="og:locale" content="es_EC" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
